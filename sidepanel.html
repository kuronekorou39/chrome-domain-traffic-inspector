<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Traffic Inspector</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1 class="title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          Traffic Inspector
        </h1>
      </div>
      <div class="header-right">
        <div class="blocking-toggle" id="blockingToggle" title="ブロック機能のON/OFF（全タブ共通）">
          <span class="blocking-label" id="blockingLabel">ON</span>
          <label class="power-toggle">
            <input type="checkbox" id="blockingSwitch" checked>
            <span class="power-slider"></span>
          </label>
        </div>
      </div>
    </header>

    <div class="mode-switcher">
      <div class="mode-toggle-container">
        <span class="mode-label" id="normalModeLabel">通常</span>
        <label class="mode-toggle">
          <input type="checkbox" id="modeToggle">
          <span class="mode-slider"></span>
        </label>
        <span class="mode-label" id="strictModeLabel">厳格</span>
      </div>
      <div class="mode-description" id="modeDescription">
        指定したドメインのみブロック（ブラックリスト方式）
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="totalDomains">0</span>
        <span class="stat-label">ドメイン</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalRequests">0</span>
        <span class="stat-label">リクエスト</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="traffic">トラフィック</button>
      <button class="tab-btn" data-tab="rules">ルール <span class="tab-count" id="rulesTabCount">0</span></button>
    </div>

    <div class="controls">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="ドメインを検索...">
      </div>
    </div>

    <div class="tab-panels">
      <div class="tab-panel active" id="trafficPanel">
        <div class="filter-sort-row">
          <div class="filter-controls">
            <label class="select-label" for="filterSelect">表示:</label>
            <select id="filterSelect" class="filter-select">
              <option value="all">全部</option>
              <option value="passing">通過</option>
              <option value="blocked">停止</option>
              <option value="ad">広告</option>
              <option value="3p">3rd</option>
            </select>
          </div>
          <div class="sort-controls">
            <label class="select-label" for="sortSelect">並び替え:</label>
            <select id="sortSelect" class="sort-select">
              <option value="count">数</option>
              <option value="name">名前</option>
            </select>
          </div>
        </div>

        <div class="bulk-actions" id="bulkActions">
          <span class="bulk-info">
            <span id="visibleCount">0</span>件表示中
          </span>
          <div class="bulk-buttons">
            <button id="bulkBlockBtn" class="bulk-btn bulk-block" title="表示中をすべてブロック">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
              すべてブロック
            </button>
            <button id="clearBtn" class="bulk-btn bulk-clear" title="カウントをリセット">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              リセット
            </button>
          </div>
        </div>

        <div class="domain-list-container">
          <div class="domain-list" id="domainList">
            <div class="empty-state" id="emptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <path d="M12 6v6l4 2"/>
              </svg>
              <p>通信を待機中...</p>
              <span class="empty-hint">ページを読み込むとドメインが表示されます</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="rulesPanel">
        <div class="rules-toolbar" id="rulesToolbar">
          <div class="rules-toolbar-normal">
            <span class="rules-toolbar-info"><span id="rulesCount">0</span>件</span>
            <div class="rules-toolbar-actions">
              <button id="addRuleBtn" class="rules-toolbar-btn" title="ルールを追加">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="16"/>
                  <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                追加
              </button>
              <button id="exportRulesBtn" class="rules-toolbar-btn" title="JSONエクスポート">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                書き出し
              </button>
              <button id="importRulesBtn" class="rules-toolbar-btn" title="JSONインポート">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                読み込み
              </button>
              <span class="toolbar-separator"></span>
              <button id="deleteAllRulesBtn" class="rules-toolbar-btn rules-toolbar-btn-danger" title="すべてのルールを削除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
                全削除
              </button>
            </div>
          </div>
          <div class="rules-toolbar-select" style="display:none">
            <span class="rules-toolbar-info"><span id="selectedCount">0</span>件選択</span>
            <div class="rules-toolbar-actions">
              <button id="bulkTagBtn" class="rules-toolbar-btn" title="選択中にタグを追加">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
                  <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                タグ
              </button>
              <button id="exportSelectedBtn" class="rules-toolbar-btn" title="選択中をエクスポート">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                書き出し
              </button>
              <button id="bulkDeleteBtn" class="rules-toolbar-btn rules-toolbar-btn-danger" title="選択中を削除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
                削除
              </button>
              <button id="clearSelectionBtn" class="rules-toolbar-btn" title="選択を解除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
                解除
              </button>
            </div>
          </div>
        </div>
        <div class="domain-list-container">
          <div class="domain-list" id="rulesList">
            <div class="empty-state" id="rulesEmptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="2"/>
              </svg>
              <p>ルールはありません</p>
              <span class="empty-hint">ドメインをブロック/許可するとここに表示されます</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none">
  </div>

  <script src="lib/domain-utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>

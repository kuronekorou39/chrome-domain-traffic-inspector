<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Traffic Inspector</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1 class="title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          Traffic Inspector
        </h1>
      </div>
      <div class="header-right">
        <div class="blocking-toggle" id="blockingToggle" title="ブロック機能のON/OFF（全タブ共通）">
          <span class="blocking-label" id="blockingLabel">ON</span>
          <label class="power-toggle">
            <input type="checkbox" id="blockingSwitch" checked>
            <span class="power-slider"></span>
          </label>
        </div>
      </div>
    </header>

    <div class="mode-switcher">
      <div class="mode-toggle-container">
        <span class="mode-label" id="normalModeLabel">通常</span>
        <label class="mode-toggle">
          <input type="checkbox" id="modeToggle">
          <span class="mode-slider"></span>
        </label>
        <span class="mode-label" id="strictModeLabel">厳格</span>
      </div>
      <div class="mode-description" id="modeDescription">
        ブラックリスト方式：選択したドメインをブロック
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="totalDomains">0</span>
        <span class="stat-label">ドメイン</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalRequests">0</span>
        <span class="stat-label">リクエスト</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="traffic">トラフィック</button>
      <button class="tab-btn" data-tab="blocked">ブロック <span class="tab-count" id="blockedTabCount">0</span></button>
      <button class="tab-btn" data-tab="allowed" id="allowedTab" style="display: none;">許可 <span class="tab-count" id="allowedTabCount">0</span></button>
      <button class="tab-btn" data-tab="ignored">スルー <span class="tab-count" id="ignoredTabCount">0</span></button>
    </div>

    <div class="controls">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="ドメインを検索...">
      </div>
      <button id="clearBtn" class="btn btn-secondary" title="カウントをリセット">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
    </div>

    <div class="tab-panels">
      <div class="tab-panel active" id="trafficPanel">
        <div class="filter-sort-row">
          <div class="filter-controls">
            <span class="filter-label">表示:</span>
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="passing">通過</button>
            <button class="filter-btn" data-filter="blocked">停止</button>
            <button class="filter-btn" data-filter="ad">広告</button>
            <button class="filter-btn" data-filter="3p">3rd</button>
          </div>
          <div class="sort-controls">
            <span class="sort-label">並び替え:</span>
            <button class="sort-btn active" data-sort="count">数</button>
            <button class="sort-btn" data-sort="name">名前</button>
          </div>
        </div>

        <div class="bulk-actions" id="bulkActions">
          <span class="bulk-info">
            <span id="visibleCount">0</span>件表示中
          </span>
          <div class="bulk-buttons">
            <button id="bulkIgnoreBtn" class="bulk-btn bulk-ignore" title="表示中をすべてスルー">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              すべてスルー
            </button>
            <button id="bulkBlockBtn" class="bulk-btn bulk-block" title="表示中をすべてブロック">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
              すべてブロック
            </button>
          </div>
        </div>

        <div class="domain-list-container">
          <div class="domain-list" id="domainList">
            <div class="empty-state" id="emptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <path d="M12 6v6l4 2"/>
              </svg>
              <p>通信を待機中...</p>
              <span class="empty-hint">ページを読み込むとドメインが表示されます</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="blockedPanel">
        <div class="bulk-unblock-bar" id="bulkUnblockBar">
          <span class="bulk-info"><span id="blockedListCount">0</span>件</span>
          <div class="bulk-buttons">
            <button id="consolidateBlockedBtn" class="bulk-btn bulk-consolidate" title="サブドメインをルートドメインに統合">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              統合
            </button>
            <button id="bulkUnblockBtn" class="bulk-btn bulk-unblock" title="すべてブロック解除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="M9 12l2 2 4-4"/>
              </svg>
              すべて解除
            </button>
          </div>
        </div>
        <div class="domain-list-container">
          <div class="domain-list" id="blockedList">
            <div class="empty-state" id="blockedEmptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
              <p>ブロック中のドメインはありません</p>
              <span class="empty-hint">ドメインの禁止アイコンをクリックするとブロックできます</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="ignoredPanel">
        <div class="bulk-unblock-bar" id="bulkUnignoreBar">
          <span class="bulk-info"><span id="ignoredListCount">0</span>件</span>
          <button id="bulkUnignoreBtn" class="bulk-btn bulk-unignore" title="すべてスルー解除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            すべて解除
          </button>
        </div>
        <div class="domain-list-container">
          <div class="domain-list" id="ignoredList">
            <div class="empty-state" id="ignoredEmptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <p>スルー中のドメインはありません</p>
              <span class="empty-hint">ドメインの目アイコンをクリックするとスルーできます</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="allowedPanel">
        <div class="bulk-unblock-bar" id="bulkDisallowBar">
          <span class="bulk-info"><span id="allowedListCount">0</span>件</span>
          <div class="bulk-buttons">
            <button id="consolidateAllowedBtn" class="bulk-btn bulk-consolidate" title="サブドメインをルートドメインに統合">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              統合
            </button>
            <button id="bulkDisallowBtn" class="bulk-btn bulk-disallow" title="すべて許可解除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
              すべて解除
            </button>
          </div>
        </div>
        <div class="domain-list-container">
          <div class="domain-list" id="allowedList">
            <div class="empty-state" id="allowedEmptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="M9 12l2 2 4-4"/>
              </svg>
              <p>許可中のドメインはありません</p>
              <span class="empty-hint">厳格モードでドメインのチェックアイコンをクリックすると許可できます</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

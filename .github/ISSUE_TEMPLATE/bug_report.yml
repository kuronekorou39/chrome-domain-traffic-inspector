name: Bug report
description: 再現可能な不具合を報告する
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: セキュリティ上の問題は公開Issueへ書かず、Securityタブの「Report a vulnerability」を利用してください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生した問題を簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 厳格モードを有効にする
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: 拡張機能バージョン
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chromeバージョン
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 機密情報を含まないログや画面写真があれば追加してください。


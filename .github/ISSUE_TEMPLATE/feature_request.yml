name: Feature request
description: 改善案や新機能を提案する
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: どのような場面で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate manifest.json
        run: |
          node -e "
            const m = require('./manifest.json');
            if (!m.manifest_version || !m.name || !m.version) {
              console.error('Invalid manifest');
              process.exit(1);
            }
            console.log('Manifest OK: ' + m.name + ' v' + m.version);
          "

      - name: Build zip
        run: |
          zip -X -r extension.zip \
            manifest.json \
            background.js \
            sidepanel.html \
            sidepanel.css \
            sidepanel.js \
            README.md \
            PRIVACY.md \
            SECURITY.md \
            CHANGELOG.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SMOKE_TEST.md \
            LICENSE \
            lib/ \
            icons/

      - name: Verify package
        run: |
          unzip -t extension.zip
          for file in manifest.json background.js sidepanel.html sidepanel.css sidepanel.js README.md PRIVACY.md SECURITY.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SMOKE_TEST.md LICENSE; do
            unzip -Z1 extension.zip | grep -Fx "$file"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: extension.zip
          retention-days: 14

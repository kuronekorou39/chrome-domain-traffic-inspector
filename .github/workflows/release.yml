name: Build & Release Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag and manifest version
        run: |
          EXPECTED="v${{ steps.version.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $EXPECTED"
            exit 1
          fi

      - name: Build zip
        run: |
          zip -X -r "domain-traffic-inspector-v${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            background.js \
            sidepanel.html \
            sidepanel.css \
            sidepanel.js \
            README.md \
            PRIVACY.md \
            SECURITY.md \
            CHANGELOG.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SMOKE_TEST.md \
            LICENSE \
            lib/ \
            icons/

      - name: Verify package
        run: |
          ARCHIVE="domain-traffic-inspector-v${{ steps.version.outputs.version }}.zip"
          unzip -t "$ARCHIVE"
          for file in manifest.json background.js sidepanel.html sidepanel.css sidepanel.js README.md PRIVACY.md SECURITY.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SMOKE_TEST.md LICENSE; do
            unzip -Z1 "$ARCHIVE" | grep -Fx "$file"
          done

      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Domain Traffic Inspector v${{ steps.version.outputs.version }}"
          body: |
            バージョン: ${{ steps.version.outputs.version }}
            コミット: ${{ github.sha }}
          files: domain-traffic-inspector-v${{ steps.version.outputs.version }}.zip
          prerelease: false
          make_latest: true
